name: Build Application

on:
  push:
    branches: [ master, main, Master ]
  pull_request:
    branches: [ master, main, Master ]

jobs:
  build-producer-api:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies - Producer API
      run: dotnet restore ProducerAPI/ProducerAPI.csproj

    - name: Build Producer API
      run: dotnet build ProducerAPI/ProducerAPI.csproj --no-restore -c Release

    - name: Test Producer API build
      run: dotnet publish ProducerAPI/ProducerAPI.csproj -c Release -o ./publish/producer-api

  build-worker-service:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies - Worker Service
      run: dotnet restore WorkerService/WorkerService.csproj

    - name: Build Worker Service
      run: dotnet build WorkerService/WorkerService.csproj --no-restore -c Release

    - name: Test Worker Service build
      run: dotnet publish WorkerService/WorkerService.csproj -c Release -o ./publish/worker-service

  build-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Build Frontend
      working-directory: ./frontend
      run: npm run build

    - name: Verify Frontend build
      run: |
        if [ -d "frontend/dist" ]; then
          echo "Frontend build successful! Files in dist:"
          ls -la frontend/dist/
        else
          echo "Error: frontend/dist directory not found"
          exit 1
        fi

