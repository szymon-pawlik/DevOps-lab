apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-service
  labels:
    app: worker-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker-service
  template:
    metadata:
      labels:
        app: worker-service
    spec:
      containers:
      - name: worker-service
        image: worker-service:latest
        imagePullPolicy: Never
        env:
        # ConfigMap values
        - name: RabbitMQ__Host
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: RABBITMQ_HOST
        - name: RabbitMQ__Port
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: RABBITMQ_PORT
        - name: RabbitMQ__Username
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: RABBITMQ_USERNAME
        # Secret values
        - name: RabbitMQ__Password
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: rabbitmq-password
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: connection-string
        - name: ApiUrl
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: API_URL
        - name: GoogleTranslate__ApiKey
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: google-translate-api-key
              optional: true
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"

