apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  labels:
    app: devops-lab
type: Opaque
stringData:
  # RabbitMQ Password
  rabbitmq-password: "guest"
  
  # PostgreSQL Password
  postgres-password: "postgres"
  
  # JWT Secret Key (for production, use a strong random key)
  jwt-secret: "YourSuperSecretJWTKeyForProductionChangeThisInRealEnvironment"
  
  # Connection String (full)
  connection-string: "Host=postgres;Port=5432;Database=jobdb;Username=postgres;Password=postgres"

